name: RC1 Validation

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'reports/ecat-icat-principle-completeness-validation.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install completeness dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate ECAT and ICAT profiles
        run: python3 tools/validate_profiles.py

      - name: Compare expected RC1 output
        run: python3 tools/check_expected.py

      - name: Check schema conformance
        run: python3 tools/check_schema_conformance.py

      - name: Check receipt generation readiness
        run: python3 tools/check_receipt_generation.py

      - name: Check management intake readiness
        run: python3 tools/check_management_intake.py

      - name: Check consumer plan
        run: python3 tools/check_consumer_execution_plan.py

      - name: Check consumer acceptance record
        run: python3 tools/check_consumer_acceptance_record.py

      - name: Check management handoff readiness
        run: python3 tools/check_management_handoff.py

      - name: Check GCAT BCAT intake
        run: python3 tools/verify_gcat_bcat_intake.py

      - name: Check RC1 release readiness structure
        run: python3 tools/check_release_ready.py

      - name: Validate principle completeness
        run: |
          python -m py_compile tools/validate_principle_completeness.py
          python tools/validate_principle_completeness.py
          python -m json.tool reports/ecat-icat-principle-completeness-validation.json >/dev/null

      - name: Generate RC1 artifact receipts
        run: |
          set -euo pipefail
          mkdir -p receipts
          find README.md RELEASE_CANDIDATE.md LICENSE docs schemas examples tests tools iosnoperiod formalism -type f | sort | xargs sha256sum > receipts/rc1-artifact-receipts.sha256

      - name: Write completion record
        run: python3 tools/write_completion_record.py

      - name: Persist principle completeness receipt
        run: |
          git config user.name "admissible-existence-ecat-icat-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ecat-icat-principle-completeness-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Record ECAT-ICAT principle completeness receipt"
            git push
          fi

      - name: Upload principle completeness receipt
        uses: actions/upload-artifact@v4
        with:
          name: ecat-icat-principle-completeness-validation
          path: reports/ecat-icat-principle-completeness-validation.json
          if-no-files-found: error

      - name: Upload RC1 artifact receipts
        uses: actions/upload-artifact@v4
        with:
          name: rc1-artifact-receipts
          path: receipts/rc1-artifact-receipts.sha256

      - name: Upload RC1 completion record
        uses: actions/upload-artifact@v4
        with:
          name: rc1-completion-record
          path: completion/rc1-completion-record.json
